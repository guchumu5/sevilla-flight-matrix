name: FlightStats Canarias y vigilados

on:
  push:
    branches: [main]
    paths:
      - 'scripts/flightstats-collector.mjs'
      - 'scripts/flightstats-parser.mjs'
      - 'src/Sync/FlightStatsClient.php'
      - 'src/Sync/FlightStatsIngestService.php'
      - '.github/workflows/flightstats-watched.yml'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightstats-watched
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ENDPOINT: ${{ vars.MATRIX_PROVIDER_URL || 'https://www.ojito.top/public/api/provider-cron.php' }}
      TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Normalizar dominio canónico
        run: echo "ENDPOINT=${ENDPOINT/https:\/\/ojito.top/https:\/\/www.ojito.top}" >> "$GITHUB_ENV"
      - name: Leer FlightStats en el servidor
        shell: bash
        run: >-
          curl --location --post301 --post302 --fail-with-body --silent --show-error --max-time 150
          -H "Authorization: Bearer ${TOKEN}"
          -H "X-Matrix-Token: ${TOKEN}"
          -H 'Content-Type: application/json'
          -H 'Accept: application/json'
          --data '{"action":"flightstats"}'
          "${ENDPOINT}"
