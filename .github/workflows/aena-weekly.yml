name: Aena programación semanal

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aena-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MATRIX_INGEST_URL: ${{ vars.MATRIX_INGEST_URL }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
      AENA_MODE: week
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar recolector
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Leer siete días y conciliar
        shell: bash
        run: |
          for attempt in 1 2; do
            if node scripts/aena-collector.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Aena no respondió correctamente tras dos intentos."
              exit 1
            fi
            echo "::warning::Infovuelos no estuvo listo; se repetirá la captura completa en 20 segundos."
            sleep 20
          done
