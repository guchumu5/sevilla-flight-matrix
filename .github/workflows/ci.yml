name: Calidad y conciliacion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sevilla_matrix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_TIMEZONE: Europe/Madrid
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: sevilla_matrix
      DB_USER: root
      DB_PASS: root

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Verificar runtime PHP
        run: |
          php --version
          php -m | grep -qi pdo_mysql

      - name: Validar sintaxis PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validar recolector Aena
        run: |
          node --check scripts/aena-collector.mjs
          node --check public/assets/js/app.js
          node --check public/sw.js
          npm run test:aena-status
          npm run test:aena-identity

      - name: Crear esquema MySQL
        run: mysql -h127.0.0.1 -uroot -proot sevilla_matrix < database/schema.sql

      - name: Comprobar copias y claves push
        run: |
          php bin/backup.php
          test "$(find storage/backups -name 'matrix-auto-*.jsonl.gz' | wc -l)" -ge 1
          php -r 'require "src/bootstrap.php"; $key=(new SevillaMatrix\Notifications\WebPushService(SevillaMatrix\Database::connection()))->publicKey(); if (strlen($key)<80) exit(1);'

      - name: Ejecutar dos capturas y una repeticion
        run: |
          php bin/sync-json.php --file=database/examples/sync_flights.example.json
          php bin/sync-json.php --file=database/examples/sync_flights.changed.example.json
          php bin/sync-json.php --file=database/examples/sync_flights.changed.example.json

      - name: Comprobar idempotencia e historico
        run: |
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flights')" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flight_codes')" = "2"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM observations')" = "2"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flight_events')" = "8"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flight_events WHERE event_type="belt_changed"')" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM sync_runs')" = "3"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM sync_runs WHERE status="failed"')" = "0"

      - name: Comprobar discrepancia entre Aena y AirLabs
        run: |
          php bin/sync-json.php --file=database/examples/sync_flights.airlabs-conflict.example.json
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flight_events WHERE source="airlabs" AND event_type="belt_assigned"')" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM flight_events WHERE source="airlabs" AND event_type="belt_changed"')" = "0"
          php -r 'require "src/bootstrap.php"; $rows=(new SevillaMatrix\FlightRepository(SevillaMatrix\Database::connection()))->board("2026-09-24"); $f=$rows[0]??[]; if (($f["source"]??null)!=="aena" || ($f["hall"]??null)!=="A" || ($f["belt"]??null)!=="2" || (int)($f["belt_changes"]??-1)!==1 || ($f["first_belt"]??null)!=="1" || ($f["secondary_belt"]??null)!=="3" || ($f["secondary_belt_state"]??null)!=="candidate" || ($f["telemetry_source"]??null)!=="airlabs" || abs((float)($f["latitude"]??0)-34.8501)>0.00001) { fwrite(STDERR, json_encode($f, JSON_PRETTY_PRINT)); exit(1); }'
          php bin/sync-json.php --file=database/examples/sync_flights.aena-stable-after-secondary.example.json
          php -r 'require "src/bootstrap.php"; $rows=(new SevillaMatrix\FlightRepository(SevillaMatrix\Database::connection()))->board("2026-09-24"); $f=$rows[0]??[]; if (($f["secondary_belt_state"]??null)!=="not_confirmed" || ($f["belt"]??null)!=="2") { fwrite(STDERR, json_encode($f, JSON_PRETTY_PRINT)); exit(1); }'

      - name: Comprobar análisis histórico de cambios de cinta
        run: |
          php bin/analyze-belt-changes.php --date=2026-09-24
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT COUNT(*) FROM belt_change_analyses WHERE analysis_date="2026-09-24"')" = "1"
          php -r 'require "src/bootstrap.php"; $rows=(new SevillaMatrix\FlightRepository(SevillaMatrix\Database::connection()))->board("2026-09-24"); $events=$rows[0]["belt_events"]??[]; $change=array_values(array_filter($events,fn($e)=>($e["event_type"]??null)==="belt_changed"))[0]??[]; if (empty($change["analysis_reason_label"])) { fwrite(STDERR,json_encode($events,JSON_PRETTY_PRINT)); exit(1); }'

      - name: Comprobar predicción previa y medición del acierto
        run: |
          php bin/sync-json.php --file=database/examples/prediction_history.example.json
          php bin/sync-json.php --file=database/examples/prediction_pending.example.json
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT predicted_belt FROM predictions p JOIN flights f ON f.id=p.flight_id WHERE f.flight_date="2026-09-25" AND f.physical_flight="VLG3049" LIMIT 1')" = "1"
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT official_assignment_seen FROM predictions p JOIN flights f ON f.id=p.flight_id WHERE f.flight_date="2026-09-25" AND f.physical_flight="VLG3049" LIMIT 1')" = "0"
          php bin/sync-json.php --file=database/examples/prediction_confirmed.example.json
          test "$(mysql -N -h127.0.0.1 -uroot -proot sevilla_matrix -e 'SELECT official_assignment_seen FROM predictions p JOIN flights f ON f.id=p.flight_id WHERE f.flight_date="2026-09-25" AND f.physical_flight="VLG3049" LIMIT 1')" = "1"
          php -r 'require "src/bootstrap.php"; $summary=(new SevillaMatrix\PredictionEngine(SevillaMatrix\Database::connection()))->summary("2026-09-25"); if (($summary["evaluated"]??0)<1 || ($summary["correct"]??0)<1 || ($summary["exact_correct"]??-1)!==0) { fwrite(STDERR, json_encode($summary, JSON_PRETTY_PRINT)); exit(1); }'
          php -r 'require "src/bootstrap.php"; $rows=(new SevillaMatrix\FlightRepository(SevillaMatrix\Database::connection()))->board("2026-09-25"); $f=$rows[0]??[]; if (($f["prediction_correct"]??null)!==1 || ($f["prediction_exact"]??null)!==0) { fwrite(STDERR,json_encode($f,JSON_PRETTY_PRINT)); exit(1); }'
          mysql -h127.0.0.1 -uroot -proot sevilla_matrix -e 'UPDATE observations o INNER JOIN flights f ON f.id=o.flight_id SET o.hall="B",o.belt="7" WHERE f.flight_date="2026-09-25" AND f.physical_flight="VLG3049" AND o.source="aena"'
          php -r 'require "src/bootstrap.php"; $rows=(new SevillaMatrix\FlightRepository(SevillaMatrix\Database::connection()))->board("2026-09-25"); $f=$rows[0]??[]; if (($f["prediction_correct"]??null)!==0 || ($f["prediction_exact"]??null)!==0) { fwrite(STDERR,json_encode($f,JSON_PRETTY_PRINT)); exit(1); }'
