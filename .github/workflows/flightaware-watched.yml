name: FlightAware vuelos vigilados

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightaware-watched
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MATRIX_FLIGHTAWARE_URL: ${{ vars.MATRIX_FLIGHTAWARE_URL || 'https://ojito.top/public/api/flightaware.php' }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Leer fichas públicas vigiladas
        run: node scripts/flightaware-collector.mjs
