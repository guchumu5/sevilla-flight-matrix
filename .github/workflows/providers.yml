name: Proveedores de respaldo

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Proveedor a ejecutar
        required: true
        default: weather
        type: choice
        options: [weather, opensky, airlabs]

permissions:
  contents: read

concurrency:
  group: provider-fallback-${{ github.event.schedule || inputs.provider }}
  cancel-in-progress: false

jobs:
  fast:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT: ${{ vars.MATRIX_PROVIDER_URL || 'https://ojito.top/public/api/provider-cron.php' }}
      TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Actualizar proveedor manual
        if: github.event_name == 'workflow_dispatch'
        run: curl --fail-with-body --retry 2 --max-time 150 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "{\"action\":\"${{ inputs.provider }}\"}" "$ENDPOINT"
      - name: Actualizar OpenSky con pausa de cuota
        if: github.event_name == 'schedule'
        run: curl --fail-with-body --retry 2 --max-time 150 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"opensky"}' "$ENDPOINT"
      - name: Actualizar meteorología
        if: github.event_name == 'schedule'
        run: curl --fail-with-body --retry 2 --max-time 150 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"weather"}' "$ENDPOINT"
      - name: Despachar avisos móviles pendientes
        if: github.event_name == 'schedule'
        run: curl --fail-with-body --retry 2 --max-time 150 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"push"}' "$ENDPOINT"

  airlabs:
    if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT: ${{ vars.MATRIX_PROVIDER_URL || 'https://ojito.top/public/api/provider-cron.php' }}
      TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Actualizar AirLabs una vez por hora
        run: curl --fail-with-body --retry 2 --max-time 150 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"airlabs"}' "$ENDPOINT"
