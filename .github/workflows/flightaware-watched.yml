name: FlightAware vuelos vigilados

on:
  push:
    branches: [main]
    paths:
      - 'scripts/flightaware-collector.mjs'
      - 'scripts/flightaware-parser.mjs'
      - '.github/workflows/flightaware-watched.yml'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightaware-watched
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MATRIX_FLIGHTAWARE_URL: ${{ vars.MATRIX_FLIGHTAWARE_URL || 'https://www.ojito.top/public/api/flightaware.php' }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar si la app solicitó una lectura
        id: queue
        shell: bash
        run: |
          endpoint="${MATRIX_FLIGHTAWARE_URL/https:\/\/ojito.top/https:\/\/www.ojito.top}"
          curl --location --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${MATRIX_INGEST_TOKEN}" \
            -H "X-Matrix-Token: ${MATRIX_INGEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${endpoint}" > "${RUNNER_TEMP}/flightaware-queue.json"
          node -e "const d=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/flightaware-queue.json','utf8')); if(!d.ok) throw new Error(d.error||'Respuesta de cola no válida'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'pending='+(Array.isArray(d.flights)&&d.flights.length>0?'true':'false')+'\n')"
      - if: steps.queue.outputs.pending == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.queue.outputs.pending == 'true'
        run: npx playwright install --with-deps chromium
      - name: Leer fichas públicas solicitadas desde la app
        if: steps.queue.outputs.pending == 'true'
        run: node scripts/flightaware-collector.mjs
      - name: Cola vacía
        if: steps.queue.outputs.pending != 'true'
        run: echo 'Sin lecturas FlightAware solicitadas desde la aplicación.'
