name: Aena programación semanal

on:
  push:
    branches: [main]
    paths:
      - 'scripts/aena-collector.mjs'
      - '.github/workflows/aena-weekly.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aena-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_INGEST_URL: ${{ vars.MATRIX_INGEST_URL }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
      AENA_MODE: week
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Leer Infovuelos JSON (ventana dos días) y conciliar
        shell: bash
        run: |
          for attempt in 1 2; do
            if node scripts/aena-collector.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::La programación Aena JSON no pudo leerse tras dos intentos."
              exit 1
            fi
            echo "::warning::Infovuelos JSON inestable; nuevo intento en 20 segundos."
            sleep 20
          done
