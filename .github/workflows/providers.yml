name: Proveedores de respaldo

on:
  push:
    branches: [main]
    paths:
      - 'public/api/provider-cron.php'
      - '.github/workflows/providers.yml'
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Proveedor a ejecutar
        required: true
        default: weather
        type: choice
        options: [weather, opensky, airlabs]

permissions:
  contents: read

concurrency:
  group: provider-fallback-${{ github.event.schedule || inputs.provider }}
  cancel-in-progress: false

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT: ${{ vars.MATRIX_PROVIDER_URL || 'https://www.ojito.top/public/api/provider-cron.php' }}
      TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Normalizar dominio canónico
        run: echo "ENDPOINT=${ENDPOINT/https:\/\/ojito.top/https:\/\/www.ojito.top}" >> "$GITHUB_ENV"
      - name: Verificar entrega de avisos al publicar
        if: github.event_name == 'push'
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data '{"action":"push"}' "$ENDPOINT"
      - name: Actualizar proveedor manual
        if: github.event_name == 'workflow_dispatch'
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data "{\"action\":\"${{ inputs.provider }}\"}" "$ENDPOINT"
      - name: Actualizar OpenSky con pausa de cuota
        if: github.event_name == 'schedule'
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data '{"action":"opensky"}' "$ENDPOINT"
      - name: Actualizar meteorología
        if: github.event_name == 'schedule'
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data '{"action":"weather"}' "$ENDPOINT"
      - name: Despachar avisos móviles pendientes
        if: github.event_name == 'schedule'
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data '{"action":"push"}' "$ENDPOINT"

  airlabs:
    if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENDPOINT: ${{ vars.MATRIX_PROVIDER_URL || 'https://www.ojito.top/public/api/provider-cron.php' }}
      TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Normalizar dominio canónico
        run: echo "ENDPOINT=${ENDPOINT/https:\/\/ojito.top/https:\/\/www.ojito.top}" >> "$GITHUB_ENV"
      - name: Actualizar AirLabs una vez por hora
        run: >-
          curl --location --post301 --post302 --fail-with-body --retry 2 --max-time 150
          -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
          -H "X-Matrix-Token: $TOKEN"
          --data '{"action":"airlabs"}' "$ENDPOINT"
