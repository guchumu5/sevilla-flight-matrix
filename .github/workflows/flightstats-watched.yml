name: FlightStats vuelos vigilados

on:
  push:
    branches: [main]
    paths:
      - 'scripts/flightstats-collector.mjs'
      - 'scripts/flightstats-parser.mjs'
      - '.github/workflows/flightstats-watched.yml'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightstats-watched
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MATRIX_FLIGHTSTATS_URL: ${{ vars.MATRIX_FLIGHTSTATS_URL || 'https://www.ojito.top/public/api/flightstats.php' }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar si hay vuelos vigilados
        id: queue
        shell: bash
        run: |
          endpoint="${MATRIX_FLIGHTSTATS_URL/https:\/\/ojito.top/https:\/\/www.ojito.top}"
          curl --location --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${MATRIX_INGEST_TOKEN}" \
            -H "X-Matrix-Token: ${MATRIX_INGEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${endpoint}" > "${RUNNER_TEMP}/flightstats-queue.json"
          node -e "const d=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/flightstats-queue.json','utf8')); if(!d.ok) throw new Error(d.error||'Respuesta de cola no válida'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'pending='+(Array.isArray(d.flights)&&d.flights.length>0?'true':'false')+'\n')"
      - name: Leer JSON público de FlightStats
        if: steps.queue.outputs.pending == 'true'
        run: node scripts/flightstats-collector.mjs
      - name: Cola vacía
        if: steps.queue.outputs.pending != 'true'
        run: echo 'Sin vuelos vigilados en la ventana de FlightStats.'
