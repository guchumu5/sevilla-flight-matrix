name: Aena en directo

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aena-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_INGEST_URL: ${{ vars.MATRIX_INGEST_URL }}
      MATRIX_INGEST_TOKEN: ${{ secrets.MATRIX_INGEST_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar recolector
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Leer Infovuelos y conciliar
        run: node scripts/aena-collector.mjs
